<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrar — MecPRIME</title>
  <link rel="stylesheet" href="/static/css/style.css">
  <link rel="stylesheet" href="/static/css/login.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="login-body">
  <div class="login-wrap">
    <!-- Painel da marca (recriado em código) -->
    <div class="login-side">
      <svg class="login-side__s" viewBox="0 0 300 380" aria-hidden="true" preserveAspectRatio="xMidYMid meet"><path d="M 40 320 L 40 60 L 150 240 L 260 60 L 260 320" fill="none" stroke="currentColor" stroke-width="56" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <div class="login-side__brand">
        <div class="login-brand__nome">Mec<span>PRIME</span></div>
        <p class="login-brand__tag">Sua oficina, nosso sistema</p>
        <div class="login-brand__bar"></div>
        <p class="login-brand__desc">Transforme a gestão do seu negócio com um sistema moderno, completo e fácil de usar.</p>
      </div>
    </div>

    <!-- Formulário -->
    <div class="login-form-side">
      <div class="login-card">
        <h1>Bem-vindo de volta</h1>
        <p class="login-sub">Entre com suas credenciais para continuar</p>

        <form id="form-login" autocomplete="on">
          <div class="field">
            <label>E-mail</label>
            <input class="login-input" type="email" name="email" placeholder="voce@empresa.com" required>
          </div>
          <div class="field">
            <label>Senha</label>
            <div class="login-inp">
              <input class="login-input" type="password" name="senha" placeholder="••••••••" required>
              <button type="button" class="login-eye" onclick="toggleSenha(this)"><i class="fa-solid fa-eye"></i></button>
            </div>
          </div>
          <div class="login-row">
            <label class="login-check">
              <input type="checkbox" name="lembrar"> Lembrar acesso
            </label>
            <a href="#" onclick="esqueciSenha(event)">Esqueci a senha</a>
          </div>
          <button type="submit" class="login-btn" id="btn-entrar">
            <i class="fa-solid fa-right-to-bracket"></i> Entrar
          </button>
        </form>
      </div>
    </div>
  </div>

  <script src="/static/js/app.js"></script>
  <script src="/static/js/login.js"></script>
</body>
</html>
